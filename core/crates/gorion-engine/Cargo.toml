[package]
name = "gorion-engine"
description = "Движок подключения Gorion: входы, маршрутизация и протоколы на своём коде (ADR-0005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Только криптографические примитивы; форматы протоколов — свои.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
subtle = "2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
base64.workspace = true
tokio-rustls = "0.26"
rustls = "0.23"

[lints]
workspace = true
