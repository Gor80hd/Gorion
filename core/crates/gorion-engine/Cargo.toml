[package]
name = "gorion-engine"
description = "Движок подключения Gorion: входы, маршрутизация и протоколы на своём коде (ADR-0005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

# Только криптографические примитивы; форматы протоколов — свои.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
subtle = "2"
# Shadowsocks 2022: ключи BLAKE3, заголовок личности — один блок AES.
blake3 = "1"
aes = "0.8"
# Настройки в формате sing-box и ответы управления (JSON).
serde_json.workspace = true
base64.workspace = true
# URL-тест по HTTPS (как у sing-box: не протокол, а проверка) и проверка
# сертификатов сервера в своём клиенте TLS: цепочка, имя, подписи.
tokio-rustls = "0.26"
rustls = "0.23"
webpki = { package = "rustls-webpki", version = "0.103" }
webpki-roots = "1"
# Сжатые сертификаты (RFC 8879): ClientHello Chrome предлагает brotli, и
# настоящие серверы им пользуются.
brotli-decompressor = "5"
# Транспорт gRPC: кадры HTTP/2, HPACK и окна — как QUIC у quinn, общий
# транспорт, а не формат протокола (ADR-0005).
h2 = "0.4"
http = "1"
bytes = "1"
# Исходящие сокеты в режиме TUN привязаны к физическому интерфейсу
# (IP_BOUND_IF), иначе они ушли бы обратно в туннель.
socket2 = { version = "0.6", features = ["all"] }

# Устройство utun на macOS: системный сокет управления, чтение и запись
# пакетов — без своего unsafe.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["socket", "net", "ioctl", "fs", "user"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true

[lints]
workspace = true
